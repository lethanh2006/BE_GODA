# Blueprint của Render: New → Blueprint → chọn repo BE_GODA. Database dùng Neon (Postgres free của Render hết hạn sau 30 ngày).
services:
  - type: web
    name: goda-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health/live
    envVars:
      # DATABASE_URL_UNPOOLED của Neon (app tự chạy migration, cần kết nối trực tiếp);
      # đổi channel_binding=require&sslmode=require thành sslmode=verify-full để pg không in cảnh báo SSL
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      # Public OAuth client ID; verified by the backend, shared with the frontend.
      - key: GOOGLE_CLIENT_ID
        value: '779200897119-t0bu3ffmtodollp5iljfre7kp33igfam.apps.googleusercontent.com'
