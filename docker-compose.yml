services:
  postgres:
    image: postgres:17-alpine
    container_name: goda-jlpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: goda
      POSTGRES_PASSWORD: '123456'
      POSTGRES_DB: goda_jlpt
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U goda -d goda_jlpt']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
